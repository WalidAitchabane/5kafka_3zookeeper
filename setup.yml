---
- name: Preparer les serveurs Kafka et Zookkeeper
  hosts: all
  become: true


  tasks:
    - name: Mettre a jour le cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer Java
      ansible.builtin.apt:
        name: openjdk-17-jre
        state: present

### Zookeeper ###

- name: Preparer les serveurs Zookeeper
  hosts: zookeeper
  become: true

  tasks:
    - name: Creer l'utilisateur Zookeeper
      ansible.builtin.user:
        name: zookeeper
        system: true
        shell: /bin/bash

    - name: Telecharger Zookeeper
      ansible.builtin.command:
        cmd: >-
          curl -fL
          https://dlcdn.apache.org/zookeeper/zookeeper-3.9.6/apache-zookeeper-3.9.6-bin.tar.gz
          -o /tmp/apache-zookeeper-3.9.6-bin.tar.gz
      args:
        creates: /tmp/apache-zookeeper-3.9.6-bin.tar.gz

    - name: Extraire Zookeeper
      ansible.builtin.unarchive:
        src: /tmp/apache-zookeeper-3.9.6-bin.tar.gz
        dest: /opt
        remote_src: true
        creates: /opt/apache-zookeeper-3.9.6-bin

    - name: Crear le lien symbolique Zookeeper
      ansible.builtin.file:
        src: /opt/apache-zookeeper-3.9.6-bin
        dest: /opt/zookeeper
        state: link

    - name: Creer le repertoire de donnees Zookeeper
      ansible.builtin.file:
        path: /var/lib/zookeeper
        state: directory
        owner: zookeeper
        group: zookeeper
        mode: '0755'

    - name: Configurer Zookeeper
      ansible.builtin.copy:
        dest: /opt/zookeeper/conf/zoo.cfg
        owner: zookeeper
        group: zookeeper
        mode: '0644'
        content: |
          tickTime=2000
          dataDir=/var/lib/zookeeper
          clientPort=2181
          initLimit=5
          syncLimit=2
          {% for host in groups['zookeeper'] %}
          server.{{ loop.index }}={{ hostvars[host]['private_ip']}}:2888:3888
          {% endfor %}

    - name: Configurer l'identifiant ZooKeeper
      ansible.builtin.copy:
        content: "{{ groups['zookeeper'].index(inventory_hostname) + 1}}"
        dest: /var/lib/zookeeper/myid
        owner: zookeeper
        group: zookeeper
        mode: '0644'

    - name: Creer le service systemd Zookeeper
      ansible.builtin.copy:
        dest: /etc/systemd/system/zookeeper.service
        owner: root 
        group: root
        mode:  '0644'
        content: |
          [Unit]
          Description=Apache Zookeeper
          After=network.target

          [Service]
          Type=simple
          User=zookeeper
          Group=zookeeper
          ExecStart=/opt/zookeeper/bin/zkServer.sh start-foreground
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Redemarrer systemd

    - name: Activer et demarrer Zookeeper
      ansible.builtin.systemd:
        name: zookeeper
        enabled: true
        state: started
        daemon_reload: true   

  handlers:
    - name: Redemarrer systemd
      ansible.builtin.systemd:
        daemon_reload: true

### Kafka ###


- name: Preparer les servuers Kafka
  hosts: kafka
  become: true

  tasks:
    - name: Creer l'utilisateur Kafka
      ansible.builtin.user:
        name: kafka
        system: true
        shell: /bin/bash

    - name: Telecharger Kafka
      ansible.builtin.command:
        cmd: >-
          curl -fL
          https://archive.apache.org/dist/kafka/3.9.2/kafka_2.13-3.9.2.tgz
          -o /tmp/kafka_2.13-3.9.2.tgz
      args:
        creates: /tmp/kafka_2.13-3.9.2.tgz

    - name: Extraire Kafka
      ansible.builtin.unarchive:
        src: /tmp/kafka_2.13-3.9.2.tgz
        dest: /opt
        remote_src: true
        creates: /opt/kafka_2.13-3.9.2

    - name: Creer le lien symbolique Kafka
      ansible.builtin.file:
        src: /opt/kafka_2.13-3.9.2
        dest: /opt/kafka
        state: link

    - name: Creer le repertoire de donnees Kafka
      ansible.builtin.file:
        path: /var/lib/kafka
        state: directory
        owner: kafka
        group: kafka
        mode: '0755'

    - name: Configurer Kafka
      ansible.builtin.copy:
        dest: /opt/kafka/config/server.properties
        owner: kafka
        group: kafka
        mode: '0644'
        content: |
            broker.id={{ inventory_hostname | regex_replace('^kafka-broker-', '') }}
            listeners=PLAINTEXT://:9092
            advertised.listeners=PLAINTEXT://{{ private_ip }}:9092
            log.dirs=/var/lib/kafka
            zookeeper.connect={% for host in groups['zookeeper'] %}{{hostvars[host]['private_ip']}}:2181{% if not loop.last %},{% endif %}{% endfor %}
            
            offsets.topic.replication.factor=3
            transaction.state.log.replication.factor=3
            transaction.state.log.min.isr=2

    - name: Creer le service systemd Kafka
      ansible.builtin.copy:
        dest: /etc/systemd/system/kafka.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Apache Kafka
          After=network.target

          [Service]
          Type=simple
          User=kafka
          Group=kafka
          Environment="KAFKA_HEAP_OPTS=-Xms256M -Xmx512M"
          ExecStart=/opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties
          ExecStop=/opt/kafka/bin/kafka-server-stop.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Redemarrer systemd

    - name: Activier et demarrer Kafka
      ansible.builtin.systemd:
        name: kafka
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Redemarrer systemd
      ansible.builtin.systemd:
        daemon_reload: true

      